spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/steelsight_local
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  thymeleaf:
    cache: false

server:
  port: 8080
