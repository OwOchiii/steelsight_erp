spring:
  config:
    # Local secrets live in .env (git-ignored). On Render these come from the environment.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/steelsight_local}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:An15092005}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that it matches
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  pattern:
    # Puts the request id on every line, so one request can be followed through the log.
    correlation: "[%X{requestId:-}] "
  level:
    orochi.steelsight: ${LOG_LEVEL:INFO}       # DEBUG also logs when each request starts
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}   # DEBUG prints every SQL statement, without values

server:
  port: 8080
  forward-headers-strategy: framework   # Render's proxy handles HTTPS and forwards to this port
  servlet:
    session:
      cookie:
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # set to true on Render

steelsight:
  detection:
    # The key the detection software sends as X-Api-Key. Left empty, the API refuses every call.
    api-key: ${STEELSIGHT_DETECTION_API_KEY:}
  bootstrap:
    # Creates the first admin when there is none. Leave the password empty to skip this.
    admin-employee-code: ${ADMIN_EMPLOYEE_CODE:ADMIN}
    admin-password: ${ADMIN_PASSWORD:}
  attendance:
    # For workers with no team. Each team has its own value, which a manager or admin edits on the Team page.
    late-after-minutes: ${LATE_AFTER_MINUTES:15}
  # Times are stored in UTC and shown in this zone.
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  storage:
    # Ticket photos. Render's disk is wiped on deploy, so production needs Supabase Storage instead.
    dir: ${STORAGE_DIR:./uploads}
