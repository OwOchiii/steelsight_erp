spring:
  config:
    # Local secrets live in .env (git-ignored). On Render these come from the environment.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/steelsight_local}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that it matches
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  thymeleaf:
    cache: false

  servlet:
    multipart:
      # A ceiling, not the rule. Photos may be 5 MB (PhotoStorage.MAX_BYTES); the app checks that itself,
      # so the form can show the problem and keep what was typed. Only a request over this ceiling is
      # refused before the page sees it, and MultipartLimitFilter turns that into a readable error page.
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health   # Only what Render's health check needs

logging:
  pattern:
    # Puts the request id on every line, so one request can be followed through the log.
    correlation: "[%X{requestId:-}] "
  level:
    orochi.steelsight: ${LOG_LEVEL:INFO}       # DEBUG also logs when each request starts
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}   # DEBUG prints every SQL statement, without values

server:
  port: ${PORT:8080}   # Render supplies PORT
  tomcat:
    # How much of a refused upload Tomcat reads and discards. Past this it drops the connection, and the
    # browser shows a network error instead of our error page. Larger than the multipart ceiling above.
    max-swallow-size: 100MB
    # Tomcat refuses a multipart form with more parts than this, before the page sees it. The new-account
    # form alone sends 12 (fields, photo, the checkbox's hidden field, the CSRF token); the default is 10.
    max-part-count: 50
  forward-headers-strategy: framework   # Render's proxy handles HTTPS and forwards to this port
  servlet:
    session:
      cookie:
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # set to true on Render

steelsight:
  detection:
    # The key the detection software sends as X-Api-Key. Left empty, the API refuses every call.
    api-key: ${STEELSIGHT_DETECTION_API_KEY:}
  bootstrap:
    # Creates the first admin when there is none. Leave the password empty to skip this.
    admin-employee-code: ${ADMIN_EMPLOYEE_CODE:ADMIN}
    admin-password: ${ADMIN_PASSWORD:}
  attendance:
    # For workers with no team. Each team has its own value, which a manager or admin edits on the Team page.
    late-after-minutes: ${LATE_AFTER_MINUTES:15}
    # A recorded visit shorter than this doesn't count as attending a shift.
    minimum-visit-minutes: ${MINIMUM_VISIT_MINUTES:10}
  # Times are stored in UTC and shown in this zone.
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  jobs:
    enabled: ${JOBS_ENABLED:true}   # the scheduled jobs of SRS 3.2.38; tests switch them off
  # The public address of the ERP, for the links at the end of Zalo messages (SRS BR-17).
  base-url: ${APP_BASE_URL:}
  zalo:                                           # all optional; without a token and link Zalo stays off
    bot-token: ${ZALO_BOT_TOKEN:}                 # from Zalo Bot Creator (bot.zaloplatforms.com)
    bot-link: ${ZALO_BOT_LINK:}                   # the bot's share link from Zalo Bot Creator, opened from the home page
    webhook-secret: ${ZALO_WEBHOOK_SECRET:}       # any random string of 8 to 256 characters
    webhook-url: ${ZALO_WEBHOOK_URL:}             # https://<erp host>/zalo/webhook; registered at startup
  storage:
    # Ticket photos: "local" keeps them on disk, "supabase" in a private bucket. Render's disk is
    # wiped on every redeploy, restart or spin-down, so the prod profile uses Supabase.
    type: ${STORAGE_TYPE:local}
    dir: ${STORAGE_DIR:./uploads}
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_KEY:}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:ticket-photos}
    supabase-face-bucket: ${SUPABASE_FACE_BUCKET:face-photos}
    supabase-evidence-bucket: ${SUPABASE_EVIDENCE_BUCKET:evidence-photos}   # violation photos the detection app uploads
