<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Violations')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('violations')}"></header>
<main class="page">
    <h1>PPE violations</h1>
    <p class="empty" th:if="${violations.isEmpty()}">You have no recorded violations.</p>
    <th:block th:unless="${violations.isEmpty()}"><ul th:replace="~{fragments/lists :: violations(${violations}, false)}"></ul></th:block>
</main>
</body>
</html>
