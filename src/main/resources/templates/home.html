<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('home')}"></header>
<main class="page">
    <h1 th:text="|Welcome, ${user.fullName}|">Welcome</h1>
    <p class="quiet" th:text="|Signed in as ${user.username} (${user.roleName})|">Signed in</p>

    <section class="tiles">
        <a class="tile" sec:authorize="hasAuthority('SHIFT_READ_OWN')" th:href="@{/timetable}">
            <span class="tile-label">Next shift</span>
            <th:block th:if="${nextShift}">
                <strong th:text="${@display.date(nextShift.startAt)}">Date</strong>
                <span th:text="|${@display.time(nextShift.startAt)} to ${@display.time(nextShift.endAt)}, ${nextShift.zone.name}|">Time</span>
            </th:block>
            <strong th:unless="${nextShift}">Nothing planned</strong>
        </a>
        <a class="tile" sec:authorize="hasAuthority('TICKET_READ_OWN')" th:href="@{/tickets}">
            <span class="tile-label">Open tickets</span>
            <strong th:text="${openTickets}">0</strong>
        </a>
        <a class="tile" sec:authorize="hasAuthority('VIOLATION_READ_OWN')" th:href="@{/violations}">
            <span class="tile-label">PPE violations</span>
            <strong th:text="${violationCount}">0</strong>
            <span th:if="${activeDisputes > 0}" th:text="|${activeDisputes} being reviewed|">Reviewing</span>
        </a>
        <a class="tile" sec:authorize="hasAnyAuthority('TICKET_READ_HANDLED', 'TICKET_READ_ALL')" th:href="@{/tickets/queue}">
            <span class="tile-label">Tickets to handle</span>
            <strong th:text="${queueCount}">0</strong>
        </a>
        <a class="tile" sec:authorize="hasAuthority('VIOLATION_READ_ALL')" th:href="@{/violations/review}">
            <span class="tile-label">Disputes to decide</span>
            <strong th:text="${disputesToDecide}">0</strong>
        </a>
        <a class="tile" sec:authorize="hasAuthority('VIOLATION_READ_ALL')" th:href="@{/violations/review(view='UNIDENTIFIED')}">
            <span class="tile-label">Violations with no worker</span>
            <strong th:text="${unidentified}">0</strong>
        </a>
        <a class="tile" sec:authorize="hasAnyAuthority('SHIFT_READ_TEAM', 'SHIFT_READ_ALL')" th:href="@{/shifts}">
            <span class="tile-label">Shifts today</span>
            <strong th:text="${shiftsToday}">0</strong>
        </a>
        <a class="tile" sec:authorize="hasAnyAuthority('CHECKIN_READ_TEAM', 'CHECKIN_READ_ALL')" th:href="@{/attendance(onSite=true)}">
            <span class="tile-label">On site now</span>
            <strong th:text="${onSite}">0</strong>
        </a>
    </section>

    <a class="btn" sec:authorize="hasAuthority('TICKET_CREATE')" th:href="@{/tickets/new}">Report a problem</a>
</main>
</body>
</html>
