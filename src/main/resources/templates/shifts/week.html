<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: app(#{shifts.title}, 'shifts', ~{::main})}">
<main class="page">
    <div class="page-head">
        <h1 th:text="#{shifts.title}">Shifts</h1>
        <a class="btn" th:if="${canPlan}" th:href="@{/shifts/new}">
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#plus}"/></svg>
            <span th:text="#{shifts.new}">New shift</span>
        </a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <nav class="week-nav" th:attr="aria-label=#{shifts.week}">
        <a class="week-link" th:href="@{/shifts(week=${previousWeek})}"><svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#chevron-left}"/></svg><span th:text="#{shifts.previousWeek}">Previous week</span></a>
        <strong th:text="#{shifts.weekRange(${@display.date(monday)}, ${@display.date(sunday)})}">Week</strong>
        <a class="week-link" th:href="@{/shifts(week=${nextWeek})}"><span th:text="#{shifts.nextWeek}">Next week</span><svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#chevron-right}"/></svg></a>
    </nav>

    <p class="empty panel-less-empty" th:if="${rows.totalElements == 0}" th:text="#{team.nobody}">Nobody is on your team yet. Ask an admin to add people.</p>
    <div class="grid-scroll" tabindex="0" role="region" th:attr="aria-label=#{shifts.gridLabel}" th:unless="${rows.isEmpty()}">
        <table class="shift-grid">
            <thead>
            <tr>
                <th scope="col" th:text="#{field.person}">Person</th>
                <th scope="col" th:each="day : ${days}" th:classappend="${day == today} ? 'today'" th:attr="aria-current=${day == today} ? 'date' : null">
                    <span th:text="${@display.weekday(day)}">Mon</span>
                    <span class="day-number" th:text="${@display.dayMonth(day)}">2 Nov</span>
                </th>
                <th scope="col" th:text="#{shifts.hours}">Hours</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <th scope="row">
                    <span th:text="${row.worker.fullName}">Name</span>
                    <span class="quiet font-normal" th:text="${row.worker.employeeCode}">Code</span>
                </th>
                <td th:each="cell : ${row.cells}" th:classappend="${cell.date == today} ? 'today'">
                    <a class="shift-chip" th:each="shift : ${cell.shifts}" th:classappend="|chip-${shift.status.name().toLowerCase()}|" th:href="@{/shifts/{id}/edit(id=${shift.id})}">
                        <strong th:text="#{common.timeRange(${@display.time(shift.startAt)}, ${@display.time(shift.endAt)})}">Time</strong>
                        <span th:text="|(${@display.hours(shift.durationHours)} h) ${shift.zone.name}|">Zone</span>
                        <span class="chip-status" th:unless="${shift.scheduled}" th:text="${@display.label(shift.status)}">Status</span>
                    </a>
                    <a class="add-shift" th:if="${canPlan and row.worker.active and cell.shifts.isEmpty()}"
                       th:href="@{/shifts/new(workerId=${row.worker.id},date=${cell.date})}"
                       th:attr="aria-label=#{shifts.addFor(${row.worker.fullName}, ${@display.date(cell.date)})}">+</a>
                </td>
                <td class="hours" th:text="${@display.hours(row.hours)}">40</td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/lists :: pager(${rows})}"></nav>
</main>
</html>
