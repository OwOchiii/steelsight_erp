<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- What a site worker sees when the bonus level is reduced (SRS BR-58). level is a SafetyLevel. -->
<section class="safety-notice" th:fragment="notice(level, score, withLink)" th:classappend="${level.number() >= 2} ? 'danger' : 'warning'" role="status">
    <h2>
        <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#triangle-alert}"/></svg>
        <span th:text="${@display.label(level)}">Level 1</span>
    </h2>
    <p th:text="#{safety.levelBody(${score}, ${level.reductionPercent()})}">Your score is low.</p>
    <p th:text="#{safety.ppe.required}">You need these to enter the construction site:</p>
    <ul>
        <li th:text="#{safety.ppe.hardHat}">Hard hat</li>
        <li th:text="#{safety.ppe.vest}">PPE vest</li>
    </ul>
    <p th:text="#{safety.dispute}">If a violation is wrong, appeal it.</p>
    <p th:if="${withLink}"><a th:href="@{/violations}" th:text="#{safety.seeViolations}">See my violations</a></p>
</section>
</body>
</html>
