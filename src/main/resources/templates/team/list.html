<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Team')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('team')}"></header>
<main class="page">
    <h1>Team</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <section class="panel" th:unless="${teams.isEmpty()}">
        <h2>Late check-in rule</h2>
        <p class="quiet">Checking in up to this long after a shift starts isn't tagged late, but the time must be made up at the end of the shift.</p>
        <form class="setting" method="post" th:each="team : ${teams}" th:action="@{/teams/{id}/late-after(id=${team.id})}">
            <div>
                <label th:for="|late-${team.id}|" th:text="|${team.name}: minutes|">Minutes</label>
                <input th:id="|late-${team.id}|" type="number" name="minutes" min="0" max="240" required th:value="${team.lateAfterMinutes}">
            </div>
            <button type="submit" class="btn secondary">Save</button>
        </form>
    </section>

    <h2>People</h2>
    <p class="empty" th:if="${members.totalElements == 0}">Nobody is on your team yet. Ask an admin to add people.</p>
    <ul class="rows" th:unless="${members.isEmpty()}">
        <li th:each="member : ${members}">
            <div class="grow">
                <strong th:text="|${member.fullName} (${member.employeeCode})|">Name</strong>
                <span class="quiet" th:text="${member.team != null} ? |${member.team.name}, ${member.role.roleName}| : ${member.role.roleName}">Team</span>
                <span class="quiet" th:if="${member.email != null or member.phoneNumber != null}"
                      th:text="${member.email != null and member.phoneNumber != null} ? |${member.email}, ${member.phoneNumber}| : (${member.email} ?: ${member.phoneNumber})">Contact</span>
            </div>
            <span class="badge" th:unless="${member.active}">Inactive</span>
            <a class="row-link" sec:authorize="hasAnyAuthority('SHIFT_UPDATE_TEAM', 'SHIFT_UPDATE_ALL')" th:if="${member.active}" th:href="@{/shifts/new(workerId=${member.id})}">Add shift</a>
            <a class="row-link" th:href="@{/team/{id}/edit(id=${member.id})}" th:unless="${member.id == #authentication.principal.userId}">Edit</a>
        </li>
    </ul>
    <nav th:replace="~{fragments/lists :: pager(${members})}"></nav>
</main>
</body>
</html>
