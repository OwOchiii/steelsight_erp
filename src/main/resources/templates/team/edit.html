<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit details')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('team')}"></header>
<main class="page narrow">
    <a class="back" th:href="@{/team}">Back to team</a>
    <h1 th:text="${member.employeeCode}">Code</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <form method="post" th:action="@{/team/{id}(id=${member.id})}" th:object="${form}">
        <input type="hidden" th:field="*{version}">
        <label for="fullName">Full name</label>
        <input id="fullName" th:field="*{fullName}" maxlength="200" required>

        <label for="email">Email <span class="optional">optional</span></label>
        <input id="email" type="email" th:field="*{email}" maxlength="200">

        <label for="phoneNumber">Phone number <span class="optional">optional</span></label>
        <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" maxlength="30">

        <button type="submit" class="btn">Save details</button>
    </form>
</main>
</body>
</html>
