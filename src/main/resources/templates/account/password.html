<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: app(#{account.passwordTitle}, 'account', ~{::main})}">
<main class="page narrow">
    <div class="page-head"><h1 th:text="#{account.passwordTitle}">Change password</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <p class="notice" th:if="${forcedPasswordChange}" th:text="#{account.forcedHint}">An admin set your password. Choose your own before you continue.</p>
    <form class="sheet" method="post" th:action="@{/account/password}">
        <label for="currentPassword" th:text="#{account.currentPassword}">Current password</label>
        <input id="currentPassword" type="password" name="currentPassword" required autocomplete="current-password">
        <label for="newPassword" th:text="#{account.newPassword}">New password</label>
        <input id="newPassword" type="password" name="newPassword" minlength="8" required autocomplete="new-password">
        <p class="hint" th:text="#{account.passwordHint}">At least 8 characters.</p>
        <label for="confirmPassword" th:text="#{account.confirmPassword}">Repeat the new password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" required autocomplete="new-password">
        <div class="actions"><button type="submit" class="btn" th:text="#{account.savePassword}">Change password</button></div>
    </form>
</main>
</html>
