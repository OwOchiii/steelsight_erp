<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tickets')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('tickets')}"></header>
<main class="page">
    <div class="title-row">
        <h1>My tickets</h1>
        <a class="btn" th:href="@{/tickets/new}">New ticket</a>
    </div>
    <p class="empty" th:if="${tickets.totalElements == 0}">You haven't opened any tickets.</p>
    <th:block th:unless="${tickets.isEmpty()}"><ul th:replace="~{fragments/lists :: tickets(${tickets}, false)}"></ul></th:block>
    <nav th:replace="~{fragments/lists :: pager(${tickets})}"></nav>
</main>
</body>
</html>
