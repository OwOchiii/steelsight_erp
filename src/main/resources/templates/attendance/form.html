<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: app(${visit} ? #{attendance.correct} : #{attendance.add}, 'attendance', ~{::main})}">
<main class="page narrow">
    <nav class="crumbs"><a th:href="@{/attendance}" th:text="#{attendance.title}">Attendance</a></nav>
    <div class="page-head"><h1 th:text="${visit} ? #{attendance.correctFor(${visit.user.fullName})} : #{attendance.add}">Check-in</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <form class="sheet" method="post" th:action="${visit} ? @{/attendance/{id}(id=${visit.id})} : @{/attendance}" th:object="${form}">
        <input type="hidden" th:field="*{version}">
        <th:block th:unless="${visit}">
            <label class="mt-0!" for="workerId" th:text="#{field.worker}">Worker</label>
            <select id="workerId" th:field="*{workerId}" required>
                <option value="" th:text="#{common.chooseWorker}">Choose a worker</option>
                <option th:each="worker : ${workers}" th:value="${worker.id}" th:text="|${worker.fullName} (${worker.employeeCode})|">Name</option>
            </select>

            <label for="zoneId"><span th:text="#{field.zone}">Zone</span> <span class="optional" th:text="#{common.optional}">optional</span></label>
            <select id="zoneId" th:field="*{zoneId}">
                <option value="" th:text="#{common.noZone}">No specific zone</option>
                <option th:each="zone : ${zones}" th:value="${zone.id}" th:text="${zone.name}">Zone</option>
            </select>
        </th:block>

        <div class="grid gap-x-4 sm:grid-cols-2">
            <div>
                <label for="checkInAt" th:text="#{field.checkedIn}">Checked in</label>
                <input id="checkInAt" type="datetime-local" th:field="*{checkInAt}" required>
            </div>
            <div>
                <label for="checkOutAt"><span th:text="#{field.checkedOut}">Checked out</span> <span class="optional" th:text="#{attendance.emptyIfOnSite}">leave empty if still on site</span></label>
                <input id="checkOutAt" type="datetime-local" th:field="*{checkOutAt}">
            </div>
        </div>

        <label for="note"><span th:text="#{field.note}">Note</span> <span class="optional" th:text="#{common.optional}">optional</span></label>
        <textarea id="note" th:field="*{note}" rows="3" maxlength="4000"></textarea>

        <div class="actions"><button type="submit" class="btn" th:text="${visit} ? #{attendance.saveCorrection} : #{attendance.add}">Save</button></div>
    </form>

    <section class="panel mt-4" th:if="${visit}" th:attr="aria-label=#{attendance.history}">
        <div class="panel-head"><h2 th:text="#{attendance.history}">Change history</h2></div>
        <div class="panel-body">
            <p class="quiet" th:if="${corrections.isEmpty()}" th:text="#{attendance.historyEmpty}">This visit hasn't been corrected.</p>
            <div class="comment" th:each="correction : ${corrections}">
                <strong class="block" th:text="${correction.correctedBy.fullName}">Name</strong>
                <span class="quiet small" th:text="${@display.dateTime(correction.correctedAt)}">When</span>
                <p class="body-text mt-1" th:if="${correction.checkInChanged}"
                   th:text="|#{field.checkedIn}: ${@display.dateTime(correction.oldCheckInAt)} → ${@display.dateTime(correction.newCheckInAt)}|">Checked in</p>
                <p class="body-text mt-1" th:if="${correction.checkOutChanged}"
                   th:text="|#{field.checkedOut}: ${correction.oldCheckOutAt != null ? @display.dateTime(correction.oldCheckOutAt) : #messages.msg('attendance.historyNone')} → ${correction.newCheckOutAt != null ? @display.dateTime(correction.newCheckOutAt) : #messages.msg('attendance.historyNone')}|">Checked out</p>
                <p class="body-text mt-1" th:if="${correction.noteChanged}"
                   th:text="|#{field.note}: ${correction.oldNote ?: #messages.msg('attendance.historyNone')} → ${correction.newNote ?: #messages.msg('attendance.historyNone')}|">Note</p>
            </div>
        </div>
    </section>
</main>
</html>
