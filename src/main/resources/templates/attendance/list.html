<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('attendance')}"></header>
<main class="page" th:with="canEdit=${#authorization.expression('hasAuthority(''CHECKIN_EDIT'')')}">
    <div class="title-row">
        <h1>Attendance</h1>
        <a class="btn" sec:authorize="hasAuthority('CHECKIN_EDIT')" th:href="@{/attendance/new}">Add a check-in</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <nav class="tabs" aria-label="Visits to show">
        <a th:href="@{/attendance}" th:attr="aria-current=${onSite} ? null : 'page'">Recent visits</a>
        <a th:href="@{/attendance(onSite=true)}" th:attr="aria-current=${onSite} ? 'page' : null">On site now</a>
    </nav>
    <p class="empty" th:if="${visits.totalElements == 0}" th:text="${onSite} ? 'Nobody is checked in.' : 'No visits have been recorded.'">Empty</p>
    <th:block th:unless="${visits.isEmpty()}"><ul th:replace="~{fragments/lists :: visits(${visits}, ${canEdit})}"></ul></th:block>
    <nav th:replace="~{fragments/lists :: pager(${visits})}"></nav>
</main>
</body>
</html>
