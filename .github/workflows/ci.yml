name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  # Builds and publishes the image from any branch, by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Testcontainers uses the Docker that GitHub's runner already has.
      - run: sh ./mvnw -B verify

  image:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow's own token, no password to store
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # Image names must be lowercase, and the repository owner isn't.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # Every image gets its commit; master's newest is also "latest".
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to run this commit's image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK secret in the repository settings"
            exit 1
          fi
          # Render only accepts a tag on the same image as the service's own image URL.
          curl --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE"
